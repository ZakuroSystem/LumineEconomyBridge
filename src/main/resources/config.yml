api:
  base_url: "http://127.0.0.1:8000"
  timeout: 2000
  token: devtoken
sync:
  interval: 10
mapcolor:
  debounce_ms: 1000

cash:
  queue_capacity: 1000

vault:
  enabled: false
  currency: "thy"

protect:
  price_per_block: "1"
  collect_account: "treasury"
  currency: ""

currency:
  decimal_places: 2

market:
  # 手数料: 取引額(税後)に対する%課金
  trade_fee_percent: 5
  # 出店料: 掲載する際に支払う固定額
  listing_fee: 400
  # 維持費: 期間ごとにかかる固定額
  upkeep:
    amount: 400
    # day または week が指定可能
    interval: "week"
