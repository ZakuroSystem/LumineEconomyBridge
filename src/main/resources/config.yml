api:
  base_url: "http://127.0.0.1:8000"
  timeout: 2000
  token: devtoken
sync:
  interval: 10
mapcolor:
  debounce_ms: 1000

cash:
  queue_capacity: 1000

vault:
  enabled: false
  currency: "thy"

protect:
  price_per_block: "1"
  collect_account: "treasury"
  currency: ""

currency:
  decimal_places: 2

market:
  # 手数料: 取引額(税後)に対する%課金
  trade_fee_percent: 5
  # 出店料: 掲載する際に支払う固定額
  listing_fee: 400
  # 維持費: 期間ごとにかかる固定額
  upkeep:
    amount: 400
    # day または week が指定可能
    interval: "week"

quest:
  seed: "server-seed"
  timezone: "Asia/Tokyo"
  groups:
    quest_daily_materials:
      name: "素材納品A"
      schedule:
        start: "2026-01-07T00:00:00+09:00"
        period_hours: 24
      rules:
        accept_limit_per_player: 1
        expire_on_cycle_change: true
        consume_items_on_complete: true
      offers:
        - id: "gunpowder_x64"
          conditions:
            op: "AND"
            items:
              - type: "minecraft:gunpowder"
                amount: 64
          rewards:
            money: 100
            items:
              - type: "minecraft:emerald"
                amount: 3
        - id: "stone_x128_multi"
          conditions:
            op: "AND"
            items:
              - type: "minecraft:stone"
                amount: 128
              - type: "minecraft:coal"
                amount: 16
          rewards:
            money: 80
            items:
              - type: "minecraft:diamond_sword"
                amount: 1
                nbt: "{Enchantments:[{id:\"minecraft:sharpness\",lvl:2s}],Damage:0}"
