api:
  base_url: "http://127.0.0.1:8000"
  timeout: 2000
  token: devtoken
sync:
  interval: 10
mapcolor:
  debounce_ms: 1000

cash:
  queue_capacity: 1000

vault:
  enabled: false
  currency: "thy"

protect:
  price_per_block: "1"
  collect_account: "treasury"
  currency: ""

currency:
  decimal_places: 2

market:
  # Percentage fee applied to seller profit after tax, e.g. 0.1 = 10%
  fee_percent: 0.0
  # Flat fee charged when listing a shop on the market
  listing_fee: 0
  upkeep:
    # Flat recurring upkeep cost for keeping a shop listed
    amount: 0
    # When to charge the upkeep fee: daily or weekly
    interval: "daily"
