api:
  base_url: "http://127.0.0.1:8000"
  timeout: 2000
  token: devtoken
sync:
  interval: 10
mapcolor:
  debounce_ms: 1000

cash:
  queue_capacity: 1000

vault:
  enabled: false
  currency: "thy"

protect:
  # 互換用の固定単価（initial_pricing_brackets未設定時に使用）
  initial_price_per_block: "1"
  # 累進課税デフォルト（min以上 max未満, max=nullで上限なし）
  initial_pricing_brackets:
    - min: 0
      max: 1000
      rate_per_block: "0.2"
    - min: 1000
      max: 10000
      rate_per_block: "0.6"
    - min: 10000
      max: 25000
      rate_per_block: "2.0"
    - min: 25000
      max: 100000
      rate_per_block: "5.0"
    - min: 100000
      max: null
      rate_per_block: "10.0"
  area_cost_height_baseline: 15
  upkeep_price_per_block: "0"
  upkeep_interval_minutes: 1440
  collect_account: "treasury"
  currency: ""

currency:
  decimal_places: 2

market:
  # 手数料: 取引額(税後)に対する%課金
  trade_fee_percent: 5
  # 出店料: 掲載する際に支払う固定額
  listing_fee: 400
  # 維持費: 期間ごとにかかる固定額
  upkeep:
    amount: 400
    # day または week が指定可能
    interval: "week"

quest:
  seed: "server-seed"
  timezone: "Asia/Tokyo"
  groups:
    quest_daily_materials:
      name: "素材納品A"
      schedule:
        start: "2026-01-07T00:00:00+09:00"
        period_hours: 24
      rules:
        accept_limit_per_player: 1
        expire_on_cycle_change: true
        consume_items_on_complete: true
        respawn_cooldown_seconds: 0
      offers:
        - id: "gunpowder_x64"
          name: "&e火薬64個納品 / Deliver 64 Gunpowder"
          description: "&7TNT素材の火薬をまとめて納品しましょう。/ Deliver a stack of gunpowder."
          conditions:
            op: "AND"
            items:
              - type: "minecraft:gunpowder"
                amount: 64
          rewards:
            money: 100
            items:
              - type: "minecraft:emerald"
                amount: 3
        - id: "stone_x128_multi"
          name: "&e石128個+石炭16個納品 / Deliver 128 Stone + 16 Coal"
          description: "&b建材と燃料を同時に納品する複合依頼です。/ Combined delivery quest."
          conditions:
            op: "AND"
            items:
              - type: "minecraft:stone"
                amount: 128
              - type: "minecraft:coal"
                amount: 16
          rewards:
            money: 80
            items:
              - type: "minecraft:diamond_sword"
                amount: 1
                nbt: "{Enchantments:[{id:\"minecraft:sharpness\",lvl:2s}],Damage:0}"

    quest_daily_shop_trade:
      name: "ショップ取引デイリー"
      schedule:
        start: "2026-01-07T00:00:00+09:00"
        period_hours: 24
      rules:
        accept_limit_per_player: 1
        expire_on_cycle_change: true
        consume_items_on_complete: false
        respawn_cooldown_seconds: 0
      offers:
        - id: "shop_trade_once"
          name: "&eショップで1回取引 / Make 1 shop trade"
          description: "&7ショップで売買どちらかを1回行う。/ Complete one buy or sell trade in a shop."
          conditions:
            op: "AND"
            shop_trades: 1
          rewards:
            money: 50
