{% extends "base.html" %}
{% block content %}
<h1>Adjust Balance</h1>
<form method="post">
  <div class="mb-3">
    <label class="form-label">UUID</label>
    <input name="uuid" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Currency</label>
    <input name="currency" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Amount (positive give, negative take)</label>
    <input type="number" name="amount" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Reason</label>
    <input name="reason" class="form-control">
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
  <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
