{% extends 'base.html' %}
{% block content %}
<h2>Top Shops</h2>
<div class="mb-4"><canvas id="rankChart"></canvas></div>
<table class="table table-striped">
  <thead><tr><th>Shop</th><th>Sales</th><th>Revenue</th></tr></thead>
  <tbody>
    {% for r in rows %}
    <tr><td>{{ r.shop_id }}</td><td>{{ r.cnt }}</td><td>{{ r.revenue }}</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
{% block scripts %}
<script>
new Chart(document.getElementById('rankChart'),{
  type:'bar',
  data:{labels: {{ chart_labels|safe }}, datasets:[{label:'Revenue', data: {{ chart_data|safe }} }]}
});
</script>
{% endblock %}
