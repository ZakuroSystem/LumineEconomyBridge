{% extends "base.html" %}
{% block content %}
<h1>Currencies</h1>
<form method="post" class="row g-2 mb-3">
  <input type="hidden" name="action" value="create">
  <div class="col-auto"><input class="form-control" name="name" placeholder="ID" required></div>
  <div class="col-auto"><input class="form-control" name="symbol" placeholder="Symbol"></div>
  <div class="col-auto"><input class="form-control" name="description" placeholder="Description"></div>
  <div class="col-auto"><button class="btn btn-primary" type="submit">Create</button></div>
</form>
<table class="table table-striped datatable">
  <thead>
    <tr><th>Name</th><th>Symbol</th><th>Description</th><th>Supply</th><th>Active</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for c in currencies %}
    <tr>
      <td>{{ c.name }}</td><td>{{ c.symbol or '' }}</td><td>{{ c.description or '' }}</td><td>{{ c.supply }}</td><td>{{ 'Yes' if c.active else 'No' }}</td>
      <td>
        <form method="post" class="d-inline">
          <input type="hidden" name="action" value="edit">
          <input type="hidden" name="name" value="{{ c.name }}">
          <input type="text" name="symbol" value="{{ c.symbol or '' }}" class="form-control form-control-sm mb-1" placeholder="Symbol">
          <input type="text" name="description" value="{{ c.description or '' }}" class="form-control form-control-sm mb-1" placeholder="Description">
          <button class="btn btn-sm btn-secondary" type="submit">Update</button>
        </form>
        <form method="post" class="d-inline ms-1">
          <input type="hidden" name="action" value="toggle">
          <input type="hidden" name="name" value="{{ c.name }}">
          <button class="btn btn-sm btn-warning" type="submit">{{ 'Disable' if c.active else 'Enable' }}</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
