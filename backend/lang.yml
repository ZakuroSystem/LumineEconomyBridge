en:
  currency:
    create: "Created currency {currency}."
    supply_header: "Current currency supply:"
    supply_entry: "{currency}: {amount}"
  money:
    give: "Gave {amount} {currency} to {target}."
    take: "Removed {amount} {currency} from {target}."
    pay: "{src} paid {dst} {amount}."
  deposit: "{src} deposited {amount} to {dst}."
  withdraw: "{src} withdrew {amount} from {dst}."
  transfer: "{src} transferred {amount} to {dst}."
  receive: "{src} sent you {amount}."
  balance:
    single: "{currency}: {amount}"
    all: "Balances: {balances}"
    empty: "No balance."
  setbalance: "Set {target}'s {currency} balance to {amount}."
  history:
    header: "Recent transactions for {player}:"
    entry: "{time}: {src}->{dst} {amount} {currency} ({reason})"
  backup:
    created: "Created backup {file}."
  restore:
    done: "Restored from backup."
  account:
    created: "Created system account {id}."
  undo:
    done: "Undid last action."
    none: "Nothing to undo."
  redo:
    done: "Redid last action."
    none: "Nothing to redo."
  help:
    header: "Available commands:"
    lines:
      - "/le balance [currency]"
      - "/le money give <player> <currency> <amount>"
      - "/le money take <player> <currency> <amount>"
      - "/le money pay <src> <dst> <currency> <amount>"
      - "/le deposit <src> <dst> <currency> <amount>"
      - "/le withdraw <src> <dst> <currency> <amount>"
      - "/le transfer <src> <dst> <currency> <amount>"
      - "/le setbalance <player> <currency> <amount>"
      - "/le history <player> [limit]"
      - "/le currency create <id> [symbol]"
      - "/le currency supply [id]"
      - "/le account create <id>"
      - "/le backup"
      - "/le restore <file>"
      - "/le undo"
      - "/le redo"
      - "/le lang <en|jp>"
    suggest: "Use /le help for details."
  error:
    invalid_args: "Invalid arguments."
    insufficient: "Insufficient funds."
    pay_failed: "Payment failed."
    no_command: "No command provided."
    no_backup: "Backup not found."
    unknown_command: "Unknown command."
  lang:
    set: "Language set to {code}."
    invalid: "Invalid language."
    switch_hint: "Type /le lang jp to switch to Japanese."
