currency:
  create: "通貨 {currency} を作成しました。"
money:
  give: "{target} の {currency} を {amount} 付与しました。"
  take: "{target} の {currency} を {amount} 減少しました。"
  pay: "{src} から {dst} へ {amount} 支払いました。"
deposit: "{src} から {dst} へ {amount} を入金しました。"
withdraw: "{src} から {dst} へ {amount} を引き出しました。"
transfer: "{src} から {dst} へ {amount} を送金しました。"
receive: "{src} から {amount} を受け取りました。"
balance:
  single: "{currency}: {amount}"
  all: "残高: {balances}"
  empty: "残高は0です。"
setbalance: "{target} の {currency} 残高を {amount} に設定しました。"
history:
  header: "{player} の最近の取引:"
  entry: "{time}: {src}->{dst} {amount} {currency} ({reason})"
backup:
  created: "バックアップ {file} を作成しました。"
restore:
  done: "バックアップから復元しました。"
account:
  created: "システムアカウント {id} を作成しました。"
undo:
  done: "直前の操作を取り消しました。"
  none: "取り消す操作がありません。"
redo:
  done: "取り消しをやり直しました。"
  none: "やり直す操作がありません。"
help:
  header: "使用可能なコマンド:"
  lines:
    - "/le balance [currency]"
    - "/le money give <player> <currency> <amount>"
    - "/le money take <player> <currency> <amount>"
    - "/le money pay <src> <dst> <currency> <amount>"
    - "/le deposit <src> <dst> <currency> <amount>"
    - "/le withdraw <src> <dst> <currency> <amount>"
    - "/le transfer <src> <dst> <currency> <amount>"
    - "/le setbalance <player> <currency> <amount>"
    - "/le history <player> [limit]"
    - "/le currency create <id> [symbol]"
    - "/le account create <id>"
    - "/le backup"
    - "/le restore <file>"
    - "/le undo"
    - "/le redo"
  suggest: "詳細は /le help を実行してください。"
error:
  invalid_args: "引数が不正です。"
  insufficient: "残高が不足しています。"
  pay_failed: "支払いに失敗しました。"
  no_command: "コマンドが指定されていません。"
  no_backup: "バックアップが見つかりません。"
  unknown_command: "不明なコマンドです。"
